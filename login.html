<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 — 資料後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f3d2b;--paper:#fbfaf7;--panel:#f1efe8;--line:#ddd9cf;--text:#22261f;--muted:#5c6157;--err:#9c3b2b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:"Noto Sans TC",sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;line-height:1.8}
.card{width:100%;max-width:430px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:30px 28px}
h1{font-family:"Noto Serif TC",serif;font-size:20px;color:var(--ink);margin:0 0 6px}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 22px}
.f{margin-bottom:14px}
.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.f input{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text)}
.f input:focus{outline:2px solid var(--ink);outline-offset:1px}
button.go{width:100%;font:inherit;font-size:15px;padding:11px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;cursor:pointer;margin-top:6px}
button.go:disabled{opacity:.5;cursor:default}
.msg{font-size:13.5px;padding:10px 12px;border-radius:4px;margin-bottom:16px;display:none}
.msg.err{display:block;background:#fbeeea;color:var(--err);border:1px solid #e8cdc5}
.msg.ok{display:block;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.hint a{color:var(--ink)}
.linkbtn{background:none;border:none;color:var(--muted);font:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0}
.sec{margin:20px 0 10px;font-size:13px;color:var(--ink);font-weight:500;border-top:1px dashed var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">資料後台</h1>
  <p class="sub" id="sub">請登入以繼續</p>
  <div class="msg" id="msg"></div>

  <!-- 登入 -->
  <form id="form-login" hidden autocomplete="on">
    <div class="f"><label for="u">帳號</label><input type="text" id="u" autocomplete="username"></div>
    <div class="f"><label for="p">密碼</label><input type="password" id="p" autocomplete="current-password"></div>
    <button class="go" type="submit">登入</button>
  </form>

  <!-- 首次設定 -->
  <form id="form-setup" hidden autocomplete="off">
    <div class="f"><label for="su">設定帳號</label><input type="text" id="su" placeholder="例如 admin"></div>
    <div class="f"><label for="sp">設定密碼</label><input type="password" id="sp" placeholder="至少 8 個字元"></div>
    <div class="f"><label for="sp2">再次輸入密碼</label><input type="password" id="sp2"></div>

    <div class="sec">GitHub 連線資訊</div>
    <div class="f"><label for="so">GitHub 帳號</label><input type="text" id="so"></div>
    <div class="f"><label for="sr">Repository 名稱</label><input type="text" id="sr"></div>
    <div class="f"><label for="sb">分支</label><input type="text" id="sb" value="main"></div>
    <div class="f"><label for="st">存取權杖 Token</label><input type="password" id="st" placeholder="github_pat_..."></div>

    <button class="go" type="submit">建立並登入</button>
    <p class="hint">Token 會用你設定的密碼加密後存在這台電腦，沒有密碼就解不開。密碼本身不會被儲存，忘記只能重設。</p>
  </form>

  <p class="hint" id="foot">
    <button class="linkbtn" id="reset">重設帳號密碼</button>　·　
    <a href="index.html">回網站</a>
  </p>
</div>

<script>
const KEY = 'chiaolab-auth';
const SESSION = 'chiaolab-session';
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();

const show = (text, kind) => { const m = $('msg'); m.textContent = text; m.className = 'msg ' + kind; };
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

/* 用密碼推導金鑰：PBKDF2 反覆雜湊 15 萬次，讓暴力破解變慢 */
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function encryptPayload(pw, obj) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}

async function decryptPayload(pw, rec) {
  const key = await deriveKey(pw, unb64(rec.salt));
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: unb64(rec.iv) }, key, unb64(rec.ct));
  return JSON.parse(dec.decode(plain));
}

const account = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } };

/* 從網址猜 GitHub 帳號與 repo 名，省得手動填 */
function guessRepo() {
  const host = location.hostname, seg = location.pathname.split('/').filter(Boolean);
  if (!host.endsWith('.github.io')) return {};
  const owner = host.replace('.github.io', '');
  const repo = (seg.length > 1) ? seg[0] : host;
  return { owner, repo };
}

function start() {
  if (!window.isSecureContext) {
    show('此頁需要 HTTPS 才能使用加密功能。請透過 github.io 網址開啟。', 'err');
    return;
  }
  const acc = account();
  if (acc) {
    $('form-login').hidden = false;
    $('u').focus();
  } else {
    $('title').textContent = '首次設定';
    $('sub').textContent = '設定一組帳號密碼，用來保護 GitHub 存取權杖。';
    const g = guessRepo();
    $('so').value = g.owner || '';
    $('sr').value = g.repo || '';
    $('form-setup').hidden = false;
    $('su').focus();
  }
}

$('form-setup').addEventListener('submit', async e => {
  e.preventDefault();
  const u = $('su').value.trim(), p = $('sp').value, p2 = $('sp2').value;
  const gh = { owner: $('so').value.trim(), repo: $('sr').value.trim(), branch: $('sb').value.trim() || 'main', token: $('st').value.trim() };
  if (!u) return show('請設定帳號。', 'err');
  if (p.length < 8) return show('密碼至少需要 8 個字元。', 'err');
  if (p !== p2) return show('兩次輸入的密碼不一致。', 'err');
  if (!gh.owner || !gh.repo || !gh.token) return show('請填完 GitHub 帳號、repo 名稱與權杖。', 'err');

  show('加密中…', 'ok');
  const rec = await encryptPayload(p, gh);
  localStorage.setItem(KEY, JSON.stringify({ user: u, ...rec }));
  sessionStorage.setItem(SESSION, JSON.stringify(gh));
  location.replace('admin.html');
});

$('form-login').addEventListener('submit', async e => {
  e.preventDefault();
  const acc = account();
  const u = $('u').value.trim(), p = $('p').value;
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  try {
    if (u !== acc.user) throw new Error('bad');
    const gh = await decryptPayload(p, acc);   // 密碼錯誤時解密會直接失敗
    sessionStorage.setItem(SESSION, JSON.stringify(gh));
    location.replace('admin.html');
  } catch (err) {
    show('帳號或密碼錯誤。', 'err');
    $('p').value = ''; $('p').focus();
  } finally { btn.disabled = false; }
});

$('reset').addEventListener('click', () => {
  if (!confirm('重設會清除這台電腦上的帳號密碼與已加密的權杖，需要重新設定一次。確定嗎？')) return;
  localStorage.removeItem(KEY);
  sessionStorage.removeItem(SESSION);
  location.reload();
});

start();
</script>
</body>
</html>
